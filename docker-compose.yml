services:
  mongo:
    image: mongo:7.0.14
    # --quiet suppresses the per-connection NETWORK log spam that the healthcheck
    # would otherwise generate every few seconds (each mongosh ping opens several
    # short-lived connections). Data operations are still logged.
    command: ["mongod", "--quiet"]
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./badhan-backend
    ports:
      - "3000:3000"
    volumes:
      - ./badhan-backend:/app
      - /app/node_modules
      - backend-dist:/app/dist
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 5
      start_period: 60s

  internal:
    build:
      context: ./badhan-backend
    command: npx nodemon --watch dist --ext js,map --delay 200ms --legacyWatch --exec "npm run internal-server"
    ports:
      - "4000:4000"
    volumes:
      - ./badhan-backend:/app
      - /app/node_modules
      - backend-dist:/app/dist
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000', r => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./badhan-frontend
    ports:
      - "8080:8080"
    volumes:
      - ./badhan-frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080', r => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 5
      start_period: 120s

  backend-test:
    profiles: ["test"]
    build:
      context: ./badhan-backend-test
    depends_on:
      backend:
        condition: service_healthy
      internal:
        condition: service_healthy

  frontend-test:
    profiles: ["test"]
    build:
      context: ./badhan-frontend-test
    depends_on:
      frontend:
        condition: service_healthy
      internal:
        condition: service_healthy

  # Deploy tooling. `profiles: ["deploy"]` keeps a ~1 GB image out of
  # `docker compose up -d` — it is built on first use, like the test services.
  # Credentials live in .deploy-auth/ inside the bind-mounted repo (reached via
  # CLOUDSDK_CONFIG / XDG_CONFIG_HOME, not $HOME), so gcloud/firebase auth
  # survives `docker compose down -v` and the host needs neither CLI installed.
  deploy:
    profiles: ["deploy"]
    build:
      context: ./badhan-deploy
    # Root on macOS (Docker Desktop maps bind-mount writes to the invoking user
    # anyway); the host uid on Linux/WSL2, exported by ./deploy and
    # deploy-container.js, so files written into .deploy-auth/ stay yours.
    user: "${DEPLOY_UID:-0}:${DEPLOY_GID:-0}"
    environment:
      CLOUDSDK_CONFIG: /repo/.deploy-auth/gcloud
      XDG_CONFIG_HOME: /repo/.deploy-auth/xdg
    # The whole repo, because the wrapper picks the working directory per
    # command (-w /repo/badhan-backend, -w /repo/badhan-frontend). No
    # node_modules volume: this container never runs the app's code, and
    # mounting one would change what `gcloud app deploy` uploads.
    volumes:
      - .:/repo
    working_dir: /repo

  # Google Play toolchain (JDK 17 + Android SDK + bubblewrap + fastlane), kept
  # as a separate ~3-4 GB image because a Play release is rare, independent of
  # ./deploy, and touches neither gcloud nor firebase. Every secret it uses is
  # cloned per-run into badhan-frontend/bubblewrap and deleted afterwards, so
  # there is nothing to persist and no login flow.
  android:
    profiles: ["deploy"]
    build:
      context: ./badhan-android
    user: "${DEPLOY_UID:-0}:${DEPLOY_GID:-0}"
    volumes:
      - .:/repo
      # Gradle's download of AGP/Gradle itself — a cache, not a credential, so
      # losing it to `down -v` costs one slow build and nothing else.
      - android-gradle:/home/deploy/.gradle
    working_dir: /repo/badhan-frontend/bubblewrap

volumes:
  mongo-data:
  backend-dist:
  android-gradle:
