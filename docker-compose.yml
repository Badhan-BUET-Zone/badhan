services:
  mongo:
    image: mongo:7.0.14
    # --quiet suppresses the per-connection NETWORK log spam that the healthcheck
    # would otherwise generate every few seconds (each mongosh ping opens several
    # short-lived connections). Data operations are still logged.
    command: ["mongod", "--quiet"]
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./badhan-backend
      # Explicit because the Dockerfile is multi-stage: with no target, a build
      # resolves to the LAST stage, which is the deploy one. Dev must stop at
      # `app`.
      target: app
    ports:
      - "3000:3000"
    volumes:
      - ./badhan-backend:/app
      - /app/node_modules
      - backend-dist:/app/dist
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 5
      start_period: 60s

  internal:
    build:
      context: ./badhan-backend
      target: app
    command: npx nodemon --watch dist --ext js,map --delay 200ms --legacyWatch --exec "npm run internal-server"
    ports:
      - "4000:4000"
    volumes:
      - ./badhan-backend:/app
      - /app/node_modules
      - backend-dist:/app/dist
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000', r => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./badhan-frontend
      target: app
    ports:
      - "8080:8080"
    volumes:
      - ./badhan-frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080', r => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 5
      start_period: 120s

  backend-test:
    profiles: ["test"]
    build:
      context: ./badhan-backend-test
    depends_on:
      backend:
        condition: service_healthy
      internal:
        condition: service_healthy

  frontend-test:
    profiles: ["test"]
    build:
      context: ./badhan-frontend-test
    depends_on:
      frontend:
        condition: service_healthy
      internal:
        condition: service_healthy

  # Bakes both of badhan-backend/src/assets/certificate-background{,-public}.png from the designer's
  # Illustrator artwork, which it fetches from certificate-artwork/ in the private secrets repo. A
  # one-off prep step — the certificate renderer reads only the finished PNGs, which come from that
  # same repo rather than from git — so it sits behind its own profile and is built on first use:
  #
  #   GH_TOKEN=$(gh auth token) docker compose --profile assets run --rm -e GH_TOKEN \
  #     certificate-assets badhan-backend/scripts/certificate-assets/render-background.sh
  #
  # GH_TOKEN because the repo is private and this container has no credentials of its own; a local
  # copy of the artwork in temp/ is used in preference and needs no token.
  #
  # Mounts the whole repo because it may read from temp/ and writes into badhan-backend/src/assets/.
  certificate-assets:
    profiles: ["assets"]
    build:
      context: ./badhan-backend/scripts/certificate-assets
    volumes:
      - .:/repo
    working_dir: /repo

  # Deploy tooling. Each app owns the CLI that deploys it, as the `deploy`
  # target of that app's Dockerfile, so there is no separate deploy image and
  # the CLI layer sits on top of layers the dev stack already built.
  # `profiles: ["deploy"]` keeps both targets out of `docker compose up -d` —
  # they are built on first use, like the test services.
  #
  # Credentials live in .deploy-auth/ inside the bind-mounted repo (reached via
  # CLOUDSDK_CONFIG / XDG_CONFIG_HOME, not $HOME), so auth survives
  # `docker compose down -v` and the host needs neither CLI installed.
  #
  # Both mount the whole repo and nothing else. That is deliberate: the
  # app services layer a node_modules volume (and, for the backend, a dist
  # volume) over their bind mount, and either would change what
  # `gcloud app deploy` uploads. A deploy must see the working tree exactly as
  # the host has it.
  backend-deploy:
    profiles: ["deploy"]
    build:
      context: ./badhan-backend
      target: deploy
    # Root on macOS (Docker Desktop maps bind-mount writes to the invoking user
    # anyway); the host uid on Linux/WSL2, exported by childEnv() in
    # deploy-container.js, so files written into .deploy-auth/ stay yours.
    user: "${DEPLOY_UID:-0}:${DEPLOY_GID:-0}"
    environment:
      CLOUDSDK_CONFIG: /repo/.deploy-auth/gcloud
    volumes:
      - .:/repo
    working_dir: /repo

  frontend-deploy:
    profiles: ["deploy"]
    build:
      context: ./badhan-frontend
      target: deploy
    user: "${DEPLOY_UID:-0}:${DEPLOY_GID:-0}"
    environment:
      XDG_CONFIG_HOME: /repo/.deploy-auth/xdg
    volumes:
      - .:/repo
    working_dir: /repo

  # Google Play toolchain (JDK 17 + Android SDK + bubblewrap + fastlane), kept
  # as a separate ~3 GB image rather than a stage of the frontend: it is built
  # on a JDK base, not a Node one, and a Play release is rare and independent of
  # ./deploy.js. Its Dockerfile lives next to the gradle project it builds; the
  # .dockerignore beside it keeps the build context to that one file. Every
  # secret it uses is cloned per-run into badhan-android and deleted
  # afterwards, so there is nothing to persist and no login flow.
  android:
    profiles: ["deploy"]
    build:
      context: ./badhan-android
    user: "${DEPLOY_UID:-0}:${DEPLOY_GID:-0}"
    volumes:
      - .:/repo
      # Gradle's download of AGP/Gradle itself — a cache, not a credential, so
      # losing it to `down -v` costs one slow build and nothing else.
      - android-gradle:/home/deploy/.gradle
    working_dir: /repo/badhan-android

volumes:
  mongo-data:
  backend-dist:
  android-gradle:
